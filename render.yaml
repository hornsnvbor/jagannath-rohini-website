services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: jagannath-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jagannath-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: 720
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://jagannathmandirrohini.com,https://jagannath-rohini-website.vercel.app,https://jagannath-rohini-website-1hebnw6po-normienishants-projects.vercel.app,https://jagannath-rohini-website-git-main-normienishant1610-gmailcoms-projects.vercel.app
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Real 80G trust details must be entered in the Render dashboard — the
      # backend refuses to start in production with placeholder (AAAAA...) values,
      # because these go on real tax receipts.
      - key: TRUST_PAN
        sync: false
      - key: TRUST_80G_REG_NO
        sync: false

  # ---------- Database (PostgreSQL) ----------
  # Note: Render no longer offers a free Postgres instance — choose the plan
  # that fits, or skip this service and point DATABASE_URL at Supabase/Railway.
  - type: postgres
    name: jagannath-db